<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wide dashboard (script-built)</title>
<style>
  /* Wide (1600×900) desktop-format asset whose content is BUILT BY A SCRIPT from a
     data array — the classic AI pattern, and the class of the 2026-07-04 import/
     viewport bugs. Free-form; a single styled board holds the generated blocks. */
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #06070a;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .board {
    width: 1600px; height: 900px;
    background: linear-gradient(135deg, #10131c 0%, #06070a 60%);
    border: 1px solid #222838; border-radius: 24px;
    padding: 72px 80px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: min-content;
    gap: 36px;
    color: #e8edf6;
  }
  .title { grid-column: 1 / -1; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; }
  .kpi { background: #161b28; border: 1px solid #263049; border-radius: 18px; padding: 40px; }
  .kpi .n { font-size: 72px; font-weight: 800; color: #4f8cff; }
  .kpi .l { font-size: 26px; color: #94a3b8; margin-top: 10px; }
  .foot { grid-column: 1 / -1; margin-top: 24px; font-size: 28px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="board" id="board"></div>
  <script>
    // The board's blocks are generated at runtime — nothing is in the static HTML.
    var data = [
      { n: '99.98%', l: 'Uptime' },
      { n: '142ms', l: 'p95 latency' },
      { n: '3.1M', l: 'Requests / day' },
      { n: '0', l: 'Sev-1 incidents' },
    ];
    var board = document.getElementById('board');
    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = 'Platform health — Q3';
    board.appendChild(title);
    data.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'kpi';
      el.innerHTML = '<div class="n">' + d.n + '</div><div class="l">' + d.l + '</div>';
      board.appendChild(el);
    });
    var foot = document.createElement('div');
    foot.className = 'foot';
    foot.textContent = 'Generated by script — a whole class of AI assets build the DOM this way.';
    board.appendChild(foot);
  </script>
</body>
</html>
